<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Navy Gradient for Light Theme -->
    <linearGradient id="luminaNavyGrad" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080D18" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Node Glow Filter for Light Theme -->
    <filter id="nodeGlowLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rail Track 1: Outer "L" Fiat Payment Rail (Deep Navy) -->
  <path d="M 64 52 V 164 C 64 186 82 204 104 204 H 192" 
        stroke="url(#luminaNavyGrad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Rail Track 2: "R" Loop Settlement Path (Dark Slate) -->
  <path d="M 64 128 H 144 C 172 128 194 108 194 82 C 194 56 172 36 144 36 H 104 C 82 36 64 54 64 76" 
        stroke="#334155" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Rail Track 3: Forward Settlement Leg (Primary Green Accent) -->
  <path d="M 128 128 L 194 194" 
        stroke="#15E113" 
        stroke-width="24" 
        stroke-linecap="round" />

  <!-- Central Stellar Settlement Node -->
  <g transform="translate(128, 128)" filter="url(#nodeGlowLight)">
    <circle r="22" fill="#FFFFFF" stroke="#080D18" stroke-width="4" />
    <path d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z" fill="#15E113" />
  </g>
</svg>
