<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoNavyGradLight" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080D18" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <style>
    .brand-text {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 54px;
      letter-spacing: -0.03em;
    }
    .text-lumina-light {
      font-weight: 800;
      fill: #080D18;
    }
    .text-rail-light {
      font-weight: 600;
      fill: #15E113;
    }
  </style>

  <!-- Left Icon Symbol (Light theme scale) -->
  <g transform="translate(10, 10) scale(0.3125)">
    <!-- Rail Track 1: Outer "L" Fiat Payment Rail (Deep Navy) -->
    <path d="M 64 52 V 164 C 64 186 82 204 104 204 H 192" 
          stroke="url(#logoNavyGradLight)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Rail Track 2: "R" Loop Settlement Path (Dark Slate) -->
    <path d="M 64 128 H 144 C 172 128 194 108 194 82 C 194 56 172 36 144 36 H 104 C 82 36 64 54 64 76" 
          stroke="#334155" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Rail Track 3: Forward Settlement Leg (Primary Green) -->
    <path d="M 128 128 L 194 194" 
          stroke="#15E113" 
          stroke-width="24" 
          stroke-linecap="round" />

    <!-- Central Stellar Settlement Node -->
    <g transform="translate(128, 128)">
      <circle r="22" fill="#FFFFFF" stroke="#080D18" stroke-width="4" />
      <path d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z" fill="#15E113" />
    </g>
  </g>

  <!-- Right Wordmark Text for Light UI -->
  <g transform="translate(108, 68)">
    <text class="brand-text">
      <tspan class="text-lumina-light">Lumina</tspan><tspan class="text-rail-light">Rail</tspan>
    </text>
  </g>
</svg>
