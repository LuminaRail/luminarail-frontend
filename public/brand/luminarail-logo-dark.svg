<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoGreenGradDark" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15E113" />
      <stop offset="100%" stop-color="#0E9E0D" />
    </linearGradient>
    <filter id="logoGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-text {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 54px;
      letter-spacing: -0.03em;
    }
    .text-lumina-dark {
      font-weight: 800;
      fill: #FFFFFF;
    }
    .text-rail-dark {
      font-weight: 500;
      fill: #15E113;
    }
  </style>

  <!-- Left Icon Symbol (Dark theme scale) -->
  <g transform="translate(10, 10) scale(0.3125)">
    <!-- Rail Track 1: Outer "L" Fiat Payment Rail -->
    <path d="M 64 52 V 164 C 64 186 82 204 104 204 H 192" 
          stroke="url(#logoGreenGradDark)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Rail Track 2: "R" Loop Settlement Path -->
    <path d="M 64 128 H 144 C 172 128 194 108 194 82 C 194 56 172 36 144 36 H 104 C 82 36 64 54 64 76" 
          stroke="#F8FAFC" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Rail Track 3: Forward Settlement Leg -->
    <path d="M 128 128 L 194 194" 
          stroke="url(#logoGreenGradDark)" 
          stroke-width="24" 
          stroke-linecap="round" />

    <!-- Central Stellar Settlement Node -->
    <g transform="translate(128, 128)" filter="url(#logoGlowDark)">
      <circle r="22" fill="#080D18" stroke="#15E113" stroke-width="4" />
      <path d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right Wordmark Text for Dark UI -->
  <g transform="translate(108, 68)">
    <text class="brand-text">
      <tspan class="text-lumina-dark">Lumina</tspan><tspan class="text-rail-dark">Rail</tspan>
    </text>
  </g>
</svg>
